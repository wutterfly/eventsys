[package]
name = "eventsys"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A library for dispatching and processing events. Events can be handled in a deferred and/or immediate way."
license = "MIT"
repository = "https://github.com/wutterfly/eventsys"
keywords = ["events", "event-system", "event-queue", "listener", "batching"]
categories = ["data-structures", "concurrency"]
exclude = [".github/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anythingy = { version = "0.3.5" }


[dev-dependencies]
criterion = { version = "0.8.2", features = [] }


# stable, comparable benchmark results
[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1


[[bench]]
harness = false
name = "listeners"

[[bench]]
harness = false
name = "batch"

[[bench]]
harness = false
name = "realistic"

[[bench]]
harness = false
name = "observe"

[[bench]]
harness = false
name = "types"
